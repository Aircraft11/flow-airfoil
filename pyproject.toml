[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flow-airfoil-cst20"
version = "0.1.0"
description = "Reversible flow matching for bidirectional airfoil aerodynamic modeling"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.10",
    "torch>=2.6",
]

[project.optional-dependencies]
examples = ["matplotlib>=3.8"]
dev = ["ruff"]

[project.scripts]
flow-airfoil-generate = "flow_airfoil.generate:main"
flow-airfoil-prepare-data = "flow_airfoil.prepare_data:main"
flow-airfoil-evaluate = "flow_airfoil.evaluate:main"
flow-airfoil-xfoil = "flow_airfoil.xfoil:main"

[tool.setuptools]
packages = ["flow_airfoil"]
package-dir = {flow_airfoil = "src"}

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
